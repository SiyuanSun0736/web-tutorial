{{define "content"}}
<div class="row">
    <div class="col-md-6">
        <h2>编辑公司信息</h2>
        <form id="editForm" action="/companies/edit/{{.ID}}" method="post">
            <div class="form-group mb-3">
                <label for="id" class="form-label">公司ID:</label>
                <input type="text" class="form-control" id="id" name="id" value="{{.ID}}" readonly>
                <small class="form-text text-muted">公司ID不可修改</small>
            </div>
            
            <div class="form-group mb-3">
                <label for="name" class="form-label">公司名称:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{.Name}}" required>
            </div>
            
            <div class="form-group mb-3">
                <label for="nickname" class="form-label">公司昵称:</label>
                <input type="text" class="form-control" id="nickname" name="nickname" value="{{.NickName}}" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">保存修改</button>
                <a href="/companies" class="btn btn-secondary ml-2">取消</a>
            </div>
        </form>
    </div>
</div>

<style>
.form-group {
    margin-bottom: 1rem;
}

.form-label {
    font-weight: bold;
    margin-bottom: 0.5rem;
    display: block;
}

.form-control {
    width: 100%;
    padding: 0.375rem 0.75rem;
    border: 1px solid #ced4da;
    border-radius: 0.25rem;
    font-size: 1rem;
    line-height: 1.5;
}

.form-control:focus {
    border-color: #80bdff;
    outline: 0;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

.form-control[readonly] {
    background-color: #e9ecef;
    opacity: 1;
}

.form-text {
    font-size: 0.875em;
    color: #6c757d;
}

.text-muted {
    color: #6c757d !important;
}

.btn {
    padding: 0.375rem 0.75rem;
    border: 1px solid transparent;
    border-radius: 0.25rem;
    text-decoration: none;
    display: inline-block;
    font-weight: 400;
    text-align: center;
    cursor: pointer;
}

.btn-primary {
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
}

.btn-primary:hover {
    background-color: #0056b3;
    border-color: #004085;
}

.btn-secondary {
    color: #fff;
    background-color: #6c757d;
    border-color: #6c757d;
}

.btn-secondary:hover {
    background-color: #545b62;
    border-color: #4e555b;
}

.ml-2 {
    margin-left: 0.5rem;
}

.mb-3 {
    margin-bottom: 1rem;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 15px;
}

.row {
    display: flex;
    flex-wrap: wrap;
    margin: 0 -15px;
}

.col-md-6 {
    flex: 0 0 50%;
    max-width: 50%;
    padding: 0 15px;
}

@media (max-width: 768px) {
    .col-md-6 {
        flex: 0 0 100%;
        max-width: 100%;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const editForm = document.getElementById('editForm');
    editForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(editForm);
        
        fetch(editForm.action, {
            method: 'POST',
            headers: {
                'Authorization': 'Basic ' + btoa('test:123')
            },
            body: formData
        }).then(response => {
            if (response.ok) {
                window.location.href = '/companies';
            } else {
                alert('保存失败');
            }
        }).catch(error => {
            console.error('Error:', error);
            alert('保存失败');
        });
    });
});
</script>
{{end}}
